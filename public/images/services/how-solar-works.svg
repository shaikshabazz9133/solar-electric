<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="Diagram: sunlight hits the roof array, an inverter converts DC to AC for the home, and a meter measures what the system sends back to the grid or a battery.">
  <title>How a rooftop solar system works</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeafa" />
      <stop offset="100%" stop-color="#f3f7fd" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcebd6" />
      <stop offset="100%" stop-color="#cbe3c3" />
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#254683" />
      <stop offset="100%" stop-color="#18305e" />
    </linearGradient>
    <linearGradient id="array" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#476fb8" />
      <stop offset="100%" stop-color="#254683" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd977" />
      <stop offset="100%" stop-color="#f7b955" />
    </linearGradient>

    <marker id="flow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 Z" fill="#3f9e6d" />
    </marker>
    <marker id="ray" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 Z" fill="#e8a53a" />
    </marker>

    <style>
      .lbl { font-family: "Jakarta Sans", "Segoe UI", system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #202a3c; }
      .lbl-sm { font-family: "Jakarta Sans", "Segoe UI", system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: #3c4a62; }
      .num { font-family: "Jakarta Sans", "Segoe UI", system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <!-- Scene -->
  <rect width="900" height="700" rx="28" fill="url(#sky)" />
  <path d="M0 470 C 170 432 300 452 452 448 C 640 443 760 468 900 452 L900 672 A28 28 0 0 1 872 700 L28 700 A28 28 0 0 1 0 672 Z" fill="url(#ground)" />
  <path d="M0 560 C 210 536 330 596 520 592 C 700 588 780 556 900 566 L900 672 A28 28 0 0 1 872 700 L28 700 A28 28 0 0 1 0 672 Z" fill="#f0ead9" />

  <!-- Distant hills -->
  <path d="M596 452 q 74 -60 148 -6 q 46 34 96 14 l 60 -8 v 8 q -150 20 -304 12 Z" fill="#c3d6ea" opacity="0.85" />

  <!-- Sun -->
  <g>
    <circle cx="118" cy="126" r="52" fill="url(#sunGlow)" />
    <g stroke="#f7b955" stroke-width="7" stroke-linecap="round">
      <line x1="118" y1="36" x2="118" y2="10" />
      <line x1="118" y1="242" x2="118" y2="216" />
      <line x1="28" y1="126" x2="2" y2="126" />
      <line x1="234" y1="126" x2="208" y2="126" />
      <line x1="54" y1="62" x2="36" y2="44" />
      <line x1="200" y1="190" x2="182" y2="172" />
      <line x1="54" y1="190" x2="36" y2="208" />
      <line x1="182" y1="80" x2="200" y2="62" />
    </g>
  </g>

  <!-- Tree -->
  <g>
    <rect x="112" y="404" width="14" height="70" rx="6" fill="#8a6a4c" />
    <circle cx="119" cy="380" r="52" fill="#7fae72" />
    <circle cx="86" cy="404" r="34" fill="#6fa063" />
    <circle cx="152" cy="402" r="32" fill="#8cbb7e" />
  </g>

  <!-- House -->
  <g>
    <!-- Walls -->
    <path d="M262 306 L262 474 L610 474 L610 306 Z" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="3" />
    <!-- Roof -->
    <path d="M244 314 L436 190 L628 314 L610 330 L436 218 L262 330 Z" fill="url(#roof)" />
    <!-- Panel array on the roof pitch -->
    <g>
      <path d="M452 236 L604 334 L560 362 L410 264 Z" fill="url(#array)" stroke="#0d1b36" stroke-width="4" stroke-linejoin="round" />
      <g stroke="#a1b7de" stroke-width="2" opacity="0.85">
        <line x1="470" y1="248" x2="428" y2="274" />
        <line x1="492" y1="262" x2="450" y2="288" />
        <line x1="514" y1="276" x2="472" y2="302" />
        <line x1="536" y1="290" x2="494" y2="316" />
        <line x1="558" y1="304" x2="516" y2="330" />
        <line x1="580" y1="318" x2="538" y2="344" />
        <line x1="431" y1="250" x2="582" y2="348" />
      </g>
    </g>
    <!-- Door and window -->
    <rect x="300" y="392" width="52" height="82" rx="6" fill="#dbe4f0" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="342" cy="434" r="4" fill="#96a1b6" />
    <rect x="298" y="336" width="56" height="36" rx="6" fill="#e6eef8" stroke="#cbd5e1" stroke-width="3" />

    <!-- Inverter and meter on the wall -->
    <g>
      <rect x="404" y="368" width="62" height="74" rx="10" fill="#e5ecf8" stroke="#7592c7" stroke-width="3" />
      <rect x="420" y="388" width="30" height="24" rx="4" fill="#32589f" />
      <text class="lbl-sm" x="435" y="432" text-anchor="middle" font-size="13" fill="#254683">DC→AC</text>

      <rect x="494" y="368" width="62" height="74" rx="10" fill="#e5ecf8" stroke="#7592c7" stroke-width="3" />
      <circle cx="525" cy="398" r="13" fill="#ffffff" stroke="#32589f" stroke-width="3" />
      <line x1="525" y1="398" x2="525" y2="389" stroke="#32589f" stroke-width="3" stroke-linecap="round" />
      <text class="lbl-sm" x="525" y="432" text-anchor="middle" font-size="13" fill="#254683">Meter</text>
    </g>
  </g>

  <!-- Utility pole -->
  <g>
    <rect x="782" y="268" width="16" height="212" rx="6" fill="#8a6a4c" />
    <rect x="742" y="298" width="96" height="12" rx="6" fill="#8a6a4c" />
    <g stroke="#96a1b6" stroke-width="3" fill="none">
      <path d="M754 306 C 700 322 660 330 628 336" />
      <path d="M826 306 C 862 316 880 322 900 326" />
    </g>
  </g>

  <!-- Energy flow -->
  <g fill="none" stroke="#3f9e6d" stroke-width="5" stroke-linecap="round" marker-end="url(#flow)">
    <path d="M488 300 L452 384" />
    <path d="M470 404 L490 404" />
    <path d="M562 388 C 640 366 700 336 748 312" />
    <path d="M400 410 C 386 410 374 410 362 410" />
  </g>

  <!-- Sun ray onto the array -->
  <path d="M168 176 L426 262" fill="none" stroke="#e8a53a" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 12" marker-end="url(#ray)" />

  <!-- Callouts -->
  <g>
    <circle cx="574" cy="112" r="22" fill="#a32c44" />
    <text class="num" x="574" y="119" text-anchor="middle">1</text>
    <text class="lbl" x="608" y="104">Photons become</text>
    <text class="lbl" x="608" y="130">electricity in the panels</text>
  </g>

  <g>
    <circle cx="222" cy="596" r="22" fill="#a32c44" />
    <text class="num" x="222" y="603" text-anchor="middle">2</text>
    <text class="lbl" x="256" y="588">DC current is turned into AC</text>
    <text class="lbl" x="256" y="614">current for use in the home</text>
  </g>

  <g>
    <circle cx="592" cy="596" r="22" fill="#a32c44" />
    <text class="num" x="592" y="603" text-anchor="middle">3</text>
    <text class="lbl" x="626" y="588">A meter measures what</text>
    <text class="lbl" x="626" y="614">you use and send back</text>
  </g>

  <text class="lbl-sm" x="640" y="196">Unused AC power goes to</text>
  <text class="lbl-sm" x="640" y="220">the grid or a home battery</text>
</svg>
